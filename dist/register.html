<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | LUXE JEWELS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style-D2OsRJHb.css">
  </head>
  <body>
    <header class="header">
      <div class="container navbar">
        <a href="index.html" class="brand">
          <span class="brand-mark">✦</span>
          <span class="brand-name">LUXE JEWELS</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="products.html" class="nav-link">Shop</a>
          <a href="products.html" class="nav-link">Categories</a>
          <a href="index.html#about" class="nav-link">About</a>
          <a href="index.html#contact" class="nav-link">Contact</a>
          <a href="login.html" class="nav-link active">Login</a>
        </nav>
        <div class="action-bar">
          <a href="cart.html" class="icon-btn" aria-label="Cart">
            🛒
            <span class="badge-count cart-count">0</span>
          </a>
          <button class="menu-toggle" aria-label="Toggle menu">☰</button>
        </div>
      </div>
    </header>

    <main class="auth-shell">
      <div class="auth-card">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join LUXE JEWELS for exclusive deals and curated luxury collections.</p>

        <form id="register-form" class="form-grid">
          <div class="form-field">
            <label for="register-name">Full Name</label>
            <input id="register-name" name="name" type="text" placeholder="Enter your full name" />
          </div>

          <div class="form-field">
            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email" placeholder="Enter your email" />
          </div>

          <div class="form-field">
            <label for="register-phone">Phone Number</label>
            <input id="register-phone" name="phone" type="tel" placeholder="Enter your phone number" />
          </div>

          <div class="form-field">
            <label for="register-password">Password</label>
            <div class="password-wrap">
              <input id="register-password" name="password" type="password" placeholder="Create a password" />
              <button id="register-password-toggle" type="button" class="password-toggle">Show</button>
            </div>
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirm Password</label>
            <div class="password-wrap">
              <input id="confirm-password" name="confirmPassword" type="password" placeholder="Confirm your password" />
              <button id="confirm-password-toggle" type="button" class="password-toggle">Show</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
          <div id="auth-message" aria-live="polite"></div>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html" class="text-link">Login</a></p>
      </div>
    </main>
  </body>
</html>
